# Host nginx for the Vite SPA (NOT used inside Docker).
# 1) Build:  cd front && npm ci && npm run build
# 2) Point root to front/dist (absolute path), then reload nginx.
#
# Example (Linux):
#   sudo cp deploy/nginx/frontend.conf /etc/nginx/conf.d/report-agent.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 8080;
    server_name _;

    # TODO: change to your absolute path of front/dist
    root /path/to/report-agent/front/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8989/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE / long-lived chat streams
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8989/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
