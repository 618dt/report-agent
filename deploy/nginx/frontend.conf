# Host nginx for the Vite SPA (NOT used inside Docker).
# Serve at http://<host>/report-agent/
#
# 1) Build with subpath base:
#      cd front && VITE_BASE=/report-agent/ npm run build
# 2) Symlink dist (absolute path), then install this conf:
#      sudo ln -sfn /home/ubuntu/report-agent/front/dist /var/www/report-agent
#      sudo cp deploy/nginx/frontend.conf /etc/nginx/conf.d/report-agent.conf
#      sudo nginx -t && sudo systemctl reload nginx
#
# API stays at /api/ (frontend apiBase is '/api').

server {
    listen 80;
    server_name _;

    # Frontend SPA under /report-agent/
    location = /report-agent {
        return 301 /report-agent/;
    }

    location /report-agent/ {
        # Symlink target: .../front/dist  →  /var/www/report-agent
        root /var/www;
        index index.html;
        try_files $uri $uri/ /report-agent/index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8989/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE / long-lived chat streams
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8989/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
