# Report Agent — Docker stack
# Usage (from repo root):
#   # 默认：mongodb + backend（用宿主机 Redis）
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
#   # 同时启动容器 Redis（需设置 REDIS_PASSWORD）：
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env --profile redis up -d --build
#
# App config: app/configs/*.yaml（mongodb/redis 账号密码须与 .env 一致）
# Compose-only: deploy/.env

name: report-agent

services:
  mongodb:
    image: mongo:7
    container_name: report-agent-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME in deploy/.env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in deploy/.env}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-report-agent-db}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "-u",
          "${MONGO_ROOT_USERNAME}",
          "-p",
          "${MONGO_ROOT_PASSWORD}",
          "--authenticationDatabase",
          "admin",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - report-agent-net

  # Optional: only started with `--profile redis`
  redis:
    profiles: ["redis"]
    image: redis:7-alpine
    container_name: report-agent-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/.env when using --profile redis}",
        "--appendonly",
        "yes",
      ]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD}",
          "ping",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - report-agent-net

  backend:
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
    image: report-agent-backend:local
    container_name: report-agent-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8989}:8989"
    # Reach Redis on the Linux host when not using `--profile redis`
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../app/configs/configs.yaml:/app/app/configs/configs.yaml:ro
      - ../app/configs/cluster.configs.yaml:/app/app/configs/cluster.configs.yaml:ro
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8989/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - report-agent-net

volumes:
  mongodb_data:
  redis_data:
  backend_logs:

networks:
  report-agent-net:
    driver: bridge
